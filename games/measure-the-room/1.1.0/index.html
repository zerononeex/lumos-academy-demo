<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Measure the Room</title>
<link rel="stylesheet" href="../../kit/1.3.0/kit.css">
<style>
  /* Things to measure are plain bars; units are blocks laid on the track below, gaps and overlaps shaded as they happen. */
  svg.room { width: min(96vw, 900px); max-height: max(calc(100cqh - 9rem), 140px); } svg.shape { width: min(80vw, 360px); }
  .thing text { font-size: 22px; font-weight: 700; fill: var(--ink); } .thing rect { stroke: var(--ink); stroke-width: 2.5; }
  .thing.pulse rect { stroke: var(--brand); stroke-width: 6; animation: pulse 1s ease-in-out infinite alternate; }
  .startline { stroke: var(--calm); stroke-width: 4; stroke-dasharray: 10 6; } .endline { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 4 6; }
  .unit { stroke: var(--ink); stroke-width: 2.5; } .unit.a { fill: #3b7dd8; } .unit.b { fill: #e8892b; } .unit.stick.a { fill: #f2c46d; } .unit.stick.b { fill: #c9a26b; }
  .unit.clip { fill: none; stroke-width: 5; } .unit.clip.a { stroke: #3b7dd8; } .unit.clip.b { stroke: #e8892b; }
  .unit.next { fill: none; stroke: var(--brand); stroke-dasharray: 8 6; stroke-width: 3; }
  .gapmark { fill: #ffd2d2; stroke: var(--warn); stroke-width: 2; stroke-dasharray: 5 4; } .overlap { fill: #c05600; fill-opacity: .55; }
  .gapmark.pulse, .overlap.pulse, .space.pulse { animation: pulse 1s ease-in-out infinite alternate; }
  .rulerbody { fill: #fff6d6; stroke: var(--ink); stroke-width: 2.5; } .cmtick { stroke: var(--ink); stroke-width: 2; }
  svg.room text { font-size: 20px; font-weight: 600; fill: var(--ink); } .space { fill: var(--brand); fill-opacity: .4; }
  .poly { fill: #e9e6ff; stroke: var(--ink); stroke-width: 4; } .walked { stroke: var(--brand); stroke-width: 9; stroke-linecap: round; }
  .walker { fill: var(--brand); }
  .side { display: flex; flex-direction: column; align-items: center; gap: .5rem; } .picks, .nudge, .picker { display: flex; flex-wrap: wrap; gap: .4rem; justify-content: center; align-items: center; }
  .picks button[aria-pressed="true"] { background: var(--brand); color: #fff; }
  .cm { font-size: 1.3rem; font-weight: 700; }
  .roomtext { margin: 0; font-size: 1rem; }
</style>
</head>
<body>
  <!-- The kit builds the screen: prompt with icon and replay, the manipulatives (picture and buttons twins), Undo, Check. -->
  <script src="../../kit/1.3.0/kit.js"></script>
  <script src="game.js"></script>
</body>
</html>
