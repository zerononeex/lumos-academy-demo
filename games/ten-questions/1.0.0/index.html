<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ten questions (placeholder)</title>
<style>
  :root { --ink:#1b1f3b; --paper:#fffdf7; --brand:#3a2fa8; --calm:#0f6b5c; --warn:#8a3b00; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; gap: .5rem; padding: .75rem; font: 1.4rem/1.4 system-ui, sans-serif; color: var(--ink); background: var(--paper); overflow: hidden; }
  body.readable { font-family: Verdana, Tahoma, sans-serif; letter-spacing: .04em; word-spacing: .12em; }
  button { font: inherit; min-height: 48px; min-width: 48px; border-radius: 16px; border: 0; background: var(--brand); color: #fff; cursor: pointer; }
  button.secondary { background: #fff; color: var(--brand); border: 3px solid var(--brand); }
  :focus-visible { outline: 4px solid var(--brand); outline-offset: 3px; }
  [hidden] { display: none !important; }
  .label { margin: 0; font-size: .85rem; opacity: .85; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
  .stones { display: flex; gap: .3rem; list-style: none; margin: 0; padding: 0; }
  .stones li { width: 1.2rem; height: 1.2rem; border-radius: 50%; border: 2px solid var(--calm); }
  .stones li.done { background: var(--calm); }
  section { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: .5rem; }
  #teach { justify-content: center; align-items: center; text-align: center; }
  #teach button { font-size: 2rem; padding: 0 2rem; min-height: 80px; }
  #qtext { margin: 0; text-align: center; font-size: clamp(2rem, 9vh, 4rem); }
  #dots { margin: 0; text-align: center; font-size: clamp(1rem, 4vh, 1.8rem); letter-spacing: .1em; min-height: 1.4em; }
  #answer { align-self: center; min-width: 5ch; text-align: center; font-size: clamp(1.8rem, 7vh, 3rem); font-weight: 700; border: 4px solid var(--ink); border-radius: 16px; padding: 0 .5rem; min-height: 1.4em; }
  .pad { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(6, 1fr); grid-auto-rows: 1fr; gap: .5rem; }
  .pad button { font-size: clamp(1.4rem, 5vh, 2.2rem); font-weight: 700; }
  #feedback { margin: 0; min-height: 1.5em; text-align: center; font-weight: 600; }
  .good { color: var(--calm); } .hint { color: var(--warn); }
  #end { justify-content: center; align-items: center; font-size: 2rem; }
</style>
</head>
<body>
  <p class="label">Placeholder game: it proves the class loop (play, finish, teacher and parent see it). It is not a real game.</p>
  <div class="bar">
    <ol class="stones" id="stones" aria-label="Your questions"></ol>
    <button id="readq" class="secondary" type="button" aria-label="Read it to me">🔊</button>
  </div>

  <section id="teach" hidden>
    <p id="example"></p>
    <button id="ready" type="button" aria-label="Start">▶ Start</button>
  </section>

  <!-- The whole game is plain HTML: keyboard-operable, no canvas, no dragging. Digits, Backspace and Enter work too. -->
  <section id="play" hidden role="group" aria-labelledby="qtext">
    <h1 id="qtext"></h1>
    <p id="dots" aria-hidden="true"></p>
    <output id="answer" aria-label="Your answer" aria-live="polite"></output>
    <div class="pad" id="pad"></div>
    <p id="feedback" role="status" aria-live="polite"></p>
  </section>

  <section id="end" hidden><h1>All done! ⭐</h1></section>
  <script src="game.js"></script>
</body>
</html>
