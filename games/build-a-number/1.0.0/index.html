<style>
  /* The trades under the mat, two to a row, so a mat to 1000 still fits a tablet screen. */
  .trades { flex-basis: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 22rem)); justify-content: center; gap: .4rem; }
  .trades button { font-size: 1.1rem; }
  .planker .count { max-width: 16rem; margin: 0; }
  svg.mat { max-height: 34vh; }
</style>
