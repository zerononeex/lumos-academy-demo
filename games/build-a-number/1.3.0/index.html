<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Build-a-Number</title>
<link rel="stylesheet" href="../../kit/1.4.0/kit.css">
<style>
  /* The trades under the mat, two to a row, so a mat to 1000 still fits the screen (the mat shares the board's height). */
  .trades { flex-basis: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 22rem)); justify-content: center; gap: .4rem; }
  .trades button { font-size: 1.1rem; }
  .planker .count { max-width: 16rem; margin: 0; }
  svg.mat { width: auto; height: clamp(110px, 38cqh, 205px); max-width: 100%; } /* the box keeps the mat's shape, so the steppers fit beside it */
  @media (max-width: 640px) { .trades button { font-size: .95rem; } svg.mat { height: clamp(80px, 25cqh, 120px); } }
</style>
</head>
<body>
  <!-- The kit builds the screen: prompt with icon and replay, the manipulatives (picture and buttons twins), Undo, Check. -->
  <script src="../../kit/1.3.0/kit.js"></script>
  <script src="game.js"></script>
</body>
</html>
