<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cosmic Conga Line</title>
<link rel="stylesheet" href="../../kit/1.7.0/kit.css">
<style>
  /* Growing towers: the cubes added since the last tower are a second colour (and named on guided items). */
  svg.towers { width: min(60vw, 520px); max-height: max(60cqh, 160px); }
  .brick { fill: #9bc4f0; stroke: var(--ink); stroke-width: 2; } .brick.added { fill: #f2a65a; }
  .nextspot { fill: #fff; stroke: var(--brand); stroke-width: 3; stroke-dasharray: 10 6; cursor: pointer; }
  svg.towers text { font-size: 26px; font-weight: 700; fill: var(--ink); }
  .towertext { margin: 0; font-size: 1rem; }
  /* The rule in words ("take away 3 each time") wraps in a fixed box, so the controls never move under Check. */
  .planker .stepper + .stepper .stepval { width: 9rem; font-size: 1.1rem; }
  /* Batch 3: the picture frame (art drop-in B3-O1) holds the pattern as a grid; the missing piece is a dashed slot. */
  .frame .quilt { display: grid; grid-template-columns: repeat(var(--cols), auto); gap: 4px; padding: 14px; border: 8px solid #c58b3c; border-image: url(../../art/pattern-parade/frame.webp) 155 / 22px round; /* B3-O1, over the border and padding: same size as before */ border-radius: 14px; background: #fffaf0; }
  .quilt .tilebox.gap { border-style: dashed; border-color: var(--brand); } .quilt .tilebox.pulse { animation: pulse 1s ease-in-out infinite alternate; }
  .quilt .tileart { width: clamp(34px, 9cqw, 52px); height: auto; }
  .palette button[aria-pressed="true"] { background: #d8efe9; border-color: var(--calm); box-shadow: 0 0 0 3px var(--calm); }
</style>
</head>
<body>
  <!-- The kit builds the screen: prompt with icon, the manipulatives (picture and buttons twins), Undo, Check. -->
  <script src="../../kit/1.7.0/kit.js"></script>
  <script src="game.js"></script>
</body>
</html>
