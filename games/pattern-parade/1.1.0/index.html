<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pattern Parade</title>
<link rel="stylesheet" href="../../kit/1.2.0/kit.css">
<style>
  /* Growing towers: the cubes added since the last tower are a second colour (and named on guided items). */
  svg.towers { width: min(60vw, 520px); max-height: max(60cqh, 160px); }
  .brick { fill: #9bc4f0; stroke: var(--ink); stroke-width: 2; } .brick.added { fill: #f2a65a; }
  .nextspot { fill: #fff; stroke: var(--brand); stroke-width: 3; stroke-dasharray: 10 6; cursor: pointer; }
  svg.towers text { font-size: 26px; font-weight: 700; fill: var(--ink); }
  .towertext { margin: 0; font-size: 1rem; }
  /* The rule in words ("take away 3 each time") wraps in a fixed box, so the controls never move under Check. */
  .planker .stepper + .stepper .stepval { width: 9rem; font-size: 1.1rem; }
</style>
</head>
<body>
  <!-- The kit builds the screen: prompt with icon and replay, the manipulatives (picture and buttons twins), Undo, Check. -->
  <script src="../../kit/1.1.0/kit.js"></script>
  <script src="game.js"></script>
</body>
</html>
