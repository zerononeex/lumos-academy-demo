<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shape Workshop</title>
<link rel="stylesheet" href="../../kit/1.3.0/kit.css">
<style>
  /* Shapes are buttons with their picture inside (one control serves both views), at least 48 px. */
  .art { width: 52px; height: 52px; display: block; }
  .art .blue { fill: #3b7dd8; } .art .orange { fill: #e8892b; } .art path, .art rect, .art circle, .art ellipse { stroke: var(--ink); stroke-width: 3; }
  .art .shade { fill: #000; fill-opacity: .18; } .art .light { fill: #fff; fill-opacity: .35; }
  .shapebtn { padding: 2px; background: #fff; border: 3px solid var(--ink); border-radius: 12px; color: var(--ink); }
  .shapebtn.pulse, .bin.pulse { animation: pulse 1s ease-in-out infinite alternate; background: #ffe9a8; }
  .rules, .ways, .palette { display: flex; flex-wrap: wrap; gap: .4rem; justify-content: center; }
  .rules button[aria-pressed="true"], .ways button[aria-pressed="true"] { background: var(--brand); color: #fff; }
  .rules button, .ways button { background: #fff; color: var(--brand); border: 3px solid var(--brand); }
  .bins { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; width: 100%; }
  .bin { min-width: 8rem; min-height: 4.5rem; flex: 1; margin: 0; border: 3px dashed var(--calm); border-radius: 14px; padding: .3rem; display: flex; flex-wrap: wrap; gap: .3rem; align-content: flex-start; }
  .bin h3 { flex-basis: 100%; margin: 0; font-size: 1rem; }
  .bin.tray { border-color: #888; flex-basis: 100%; }
  svg.board { width: min(92vw, 520px); max-height: max(calc(100cqh - 8rem), 170px); } svg.mover { max-height: max(calc(100cqh - 11rem), 140px); }
  .gap { fill: #fff; stroke: var(--brand); stroke-width: 4; stroke-dasharray: 10 6; cursor: pointer; }
  .gapg.selected .gap { fill: #ffe9a8; } .gapg.pulse .gap { fill: #ffd2a8; animation: pulse 1s ease-in-out infinite alternate; }
  .piece { stroke: var(--ink); stroke-width: 3; } .piece.blue { fill: #3b7dd8; } .piece.orange { fill: #e8892b; } .piece.green { fill: #7fb27b; }
  .piece.extra { fill: #ffd2a8; stroke: #c05600; stroke-dasharray: 8 5; } .piece.ghost { fill: none; stroke: var(--brand); stroke-dasharray: 10 6; stroke-width: 4; }
  .wedge { fill: #fff; stroke: #999; stroke-width: 2; stroke-dasharray: 6 5; } .wedge.pulse { fill: #ffe9a8; animation: pulse 1s ease-in-out infinite alternate; }
  .outline { fill: none; stroke: var(--ink); stroke-width: 5; }
  .grid line { stroke: #bbb; stroke-width: 2; } .goal { fill: #fff6d6; stroke: var(--brand); stroke-width: 4; stroke-dasharray: 9 6; }
  .goal.pulse { animation: pulse 1s ease-in-out infinite alternate; } .foot { fill: #fff; }
  .lshape rect { fill: #3b7dd8; stroke: var(--ink); stroke-width: 3; } .lshape.ghost rect { fill: none; stroke: var(--calm); stroke-dasharray: 8 5; }
  .moves { display: grid; grid-template-columns: repeat(3, auto); gap: .4rem; justify-content: center; }
  .spin { transition: none; } .name { font-size: 1.3rem; font-weight: 700; text-align: center; }
  svg.turn { width: min(38vw, 220px); max-height: max(calc(100cqh - 10rem), 120px); }
  .disc { fill: #e9e6ff; stroke: var(--brand); stroke-width: 4; }
  .face > rect { fill: #fff; stroke: var(--ink); stroke-width: 3; cursor: pointer; } .face > text { font-size: 30px; font-weight: 700; fill: var(--ink); pointer-events: none; }
  .face.mark > rect { fill: #ffe9a8; } .face.pick > rect { fill: #d8efe9; stroke: var(--calm); stroke-width: 6; } .face.grey > rect { fill: #ddd; }
  .face.folding { transition: transform .7s ease-in-out; } .cube path { stroke: var(--ink); stroke-width: 3; fill: #fff; } .cube text { font-size: 20px; font-weight: 700; stroke: none; fill: var(--ink); }
  .cube .opp { fill: #d8efe9; } .cube .mark { fill: #ffe9a8; }
  .shapetext { margin: 0; font-size: 1rem; } .shapelist { list-style: none; margin: 0; padding: 0; gap: .3rem; grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr)); }
  @media (max-width: 640px) { .bin { min-width: 6rem; } .art { width: 44px; height: 44px; } }
</style>
</head>
<body>
  <!-- The kit builds the screen: prompt with icon and replay, the manipulatives (picture and buttons twins), Undo, Check. -->
  <script src="../../kit/1.3.0/kit.js"></script>
  <script src="game.js"></script>
</body>
</html>
